# =============================================================================
# Base: nome, rete, API, OTA, orario. Tutto sovrascrivibile da substitutions.
# =============================================================================

substitutions:
  device_name: ha-strip
  friendly_name: HA Strip
  timezone: Europe/Rome
  display_rotation: "90"       # 270 per capovolgere la striscia
  # Calibrazione touch (valori nativi del pannello; ESPHome applica poi la rotazione)
  touch_swap_xy: "true"
  touch_mirror_x: "false"
  touch_mirror_y: "true"
  idle_timeout: "60"           # secondi, valore iniziale (poi regolabile da HA)
  brightness_active: "100%"
  brightness_idle: "15"        # %, valore iniziale (poi regolabile da HA)
  log_level: INFO              # DEBUG per vedere coordinate dei tocchi e click
  lvgl_log_level: WARN         # INFO per i dettagli di input LVGL

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2025.7.0

logger:
  level: ${log_level}

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password
    on_begin:
      # evita lo sfarfallio del display durante l'OTA
      - light.turn_off:
          id: display_backlight
          transition_length: 0s
      - lambda: "id(display_backlight).loop();"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_password

captive_portal:

time:
  - platform: homeassistant
    id: ha_time
    timezone: ${timezone}
    on_time:
      - seconds: 0
        then:
          - script.execute: update_clock
    on_time_sync:
      then:
        - script.execute: update_clock

sensor:
  - platform: wifi_signal
    name: "WiFi RSSI"
    update_interval: 60s
    entity_category: diagnostic

switch:
  # Disattivabile da HA: se spento lo schermo resta sempre alla luminosita' piena
  - platform: template
    id: sw_dimming
    name: "Dimming automatico"
    icon: mdi:brightness-auto
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_off:
      - light.turn_on:
          id: display_backlight
          brightness: ${brightness_active}

number:
  - platform: template
    id: num_idle_timeout
    name: "Timeout dimming"
    icon: mdi:timer-outline
    entity_category: config
    unit_of_measurement: s
    min_value: 10
    max_value: 3600
    step: 10
    mode: box
    optimistic: true
    restore_value: true
    initial_value: ${idle_timeout}
  - platform: template
    id: num_brightness_idle
    name: "Luminosità a riposo"
    icon: mdi:brightness-4
    entity_category: config
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 5
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: ${brightness_idle}

binary_sensor:
  - platform: status
    name: "Stato"
