# =============================================================================
# Base: nome, rete, API, OTA, orario. Tutto sovrascrivibile da substitutions.
# =============================================================================

substitutions:
  device_name: ha-strip
  friendly_name: HA Strip
  timezone: Europe/Rome
  display_rotation: "90"       # 270 per capovolgere la striscia
  # Calibrazione touch (valori nativi del pannello; ESPHome applica poi la rotazione)
  touch_swap_xy: "true"
  touch_mirror_x: "false"
  touch_mirror_y: "true"
  idle_timeout: 60s            # dopo quanto si abbassa la luminosita'
  brightness_active: "100%"
  brightness_idle: "15%"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2025.7.0

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password
    on_begin:
      # evita lo sfarfallio del display durante l'OTA
      - light.turn_off:
          id: display_backlight
          transition_length: 0s
      - lambda: "id(display_backlight).loop();"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_password

captive_portal:

time:
  - platform: homeassistant
    id: ha_time
    timezone: ${timezone}
    on_time:
      - seconds: 0
        then:
          - script.execute: update_clock
    on_time_sync:
      then:
        - script.execute: update_clock

sensor:
  - platform: wifi_signal
    name: "WiFi RSSI"
    update_interval: 60s
    entity_category: diagnostic

binary_sensor:
  - platform: status
    name: "Stato"
